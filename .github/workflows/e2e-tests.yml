name: E2E Integration Tests

on:
  push:
    branches:
      - main
      - microservices-refactor
  pull_request:
    branches:
      - main
      - microservices-refactor
  workflow_dispatch:

jobs:
  e2e-tests:
    name: End-to-End Pipeline Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Start services with Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 30
      
      - name: Check service health
        run: |
          docker-compose ps
          docker-compose logs --tail=50
      
      - name: Set up Python for E2E tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install E2E test dependencies
        working-directory: tests/e2e
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run E2E tests
        working-directory: tests/e2e
        run: |
          pytest test_pipeline.py -v --cov=. --cov-report=xml --cov-report=term-missing
        continue-on-error: true
      
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Ingest Service Logs ==="
          docker-compose logs telemetry-ingest
          echo "=== Processor Service Logs ==="
          docker-compose logs telemetry-processor
          echo "=== Frontend Service Logs ==="
          docker-compose logs telemetry-frontend
          echo "=== Simulator Service Logs ==="
          docker-compose logs telemetry-simulator || true
      
      - name: Stop services
        if: always()
        run: |
          docker-compose down -v
      
      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/e2e/htmlcov/
