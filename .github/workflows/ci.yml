name: CI

on:
  push:
    branches: [ main, microservices-refactor, develop ]
  pull_request:
    branches: [ main, microservices-refactor, develop ]
  workflow_dispatch:

jobs:
  # Check if documentation exists
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Verify documentation files exist
        run: |
          echo "Checking for required documentation..."
          test -f README.md || (echo "❌ Missing README.md" && exit 1)
          test -f DEVELOPMENT.md || (echo "❌ Missing DEVELOPMENT.md" && exit 1)
          test -f docs/ARCHITECTURE.md || (echo "❌ Missing docs/ARCHITECTURE.md" && exit 1)
          test -f docs/DEPLOYMENT.md || (echo "❌ Missing docs/DEPLOYMENT.md" && exit 1)
          test -f CHANGELOG.md || (echo "❌ Missing CHANGELOG.md" && exit 1)
          echo "✅ All documentation files exist"

  # C++ Service Tests
  cpp-tests:
    name: C++ Ingest Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libzmq3-dev libgtest-dev
      
      - name: Build and Test
        working-directory: services/telemetry-ingest
        run: |
          cmake --preset=default -DBUILD_TESTS=ON
          cmake --build build -j$(nproc)
          echo "✅ C++ service built successfully"
          # Tests would run here when implemented
          # cd build && ctest --output-on-failure --verbose

  # Python Services Tests
  python-tests:
    name: Python Services Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [telemetry-processor, telemetry-simulator]
        python-version: ['3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          poetry install --with dev
      
      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          poetry run pytest
          echo "✅ Tests passed for ${{ matrix.service }}"
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
        continue-on-error: true

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/telemetry-frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: services/telemetry-frontend
        run: npm ci
      
      - name: Run tests with coverage
        working-directory: services/telemetry-frontend
        run: npm run test:coverage
      
      - name: Build frontend
        working-directory: services/telemetry-frontend
        run: npm run build
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/telemetry-frontend/coverage/coverage-final.json
          flags: telemetry-frontend
        continue-on-error: true

  # Summary
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [docs-check, cpp-tests, python-tests, frontend-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "📊 CI Results Summary:"
          echo "- Docs Check: ${{ needs.docs-check.result }}"
          echo "- C++ Tests: ${{ needs.cpp-tests.result }}"
          echo "- Python Tests: ${{ needs.python-tests.result }}"
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}"
          
          if [[ "${{ needs.docs-check.result }}" == "success" ]] && \
             [[ "${{ needs.cpp-tests.result }}" == "success" ]] && \
             [[ "${{ needs.python-tests.result }}" == "success" ]] && \
             [[ "${{ needs.frontend-tests.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi
