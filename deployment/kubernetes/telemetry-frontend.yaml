apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-frontend
  labels:
    app: telemetry-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-frontend
  template:
    metadata:
      labels:
        app: telemetry-frontend
    spec:
      containers:
        - name: telemetry-frontend
          image: f1-telemetry-frontend:dev
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: VITE_WEBSOCKET_URL
              value: "ws://telemetry-processor:8765"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-frontend
spec:
  selector:
    app: telemetry-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
