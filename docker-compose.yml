services:
  # ZeroMQ Message Broker (for now, will migrate to Kafka later)
  zeromq-broker:
    image: alpine:latest
    container_name: f1-zeromq-broker
    networks:
      - f1-telemetry-network
    command: tail -f /dev/null  # Placeholder for ZMQ broker
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Service 0: Telemetry Simulator Backend (Replaces F1 Game for testing)
  telemetry-simulator-backend:
    build:
      context: ./services/telemetry-simulator-backend
      dockerfile: Dockerfile
      target: runtime
    container_name: f1-telemetry-simulator-backend
    restart: unless-stopped
    environment:
      - TARGET_HOST=telemetry-ingest
      - TARGET_PORT=20777
      - CONFIG_FILE=config/race_simulation.json
    networks:
      - f1-telemetry-network
    volumes:
      - ./services/telemetry-simulator-backend/config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      telemetry-ingest:
        condition: service_healthy

  # Service 0.5: Telemetry Simulator Frontend (Control interface for simulator)
  telemetry-simulator-frontend:
    build:
      context: ./services/telemetry-simulator-frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: f1-telemetry-simulator-frontend
    restart: unless-stopped
    ports:
      - "3001:80"  # Production Nginx port
    environment:
      - NODE_ENV=production
    networks:
      - f1-telemetry-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Service 1: Telemetry Ingest (C++ UDP Listener & Parser)
  telemetry-ingest:
    build:
      context: ./services/telemetry-ingest
      dockerfile: Dockerfile
      target: runtime
    container_name: f1-telemetry-ingest
    restart: unless-stopped
    ports:
      - "20777:20777/udp"  # F1 Game UDP telemetry port
    environment:
      - ZMQ_PUBLISHER_ENDPOINT=tcp://*:5555
      - UDP_LISTEN_PORT=20777
      - LOG_LEVEL=info
    networks:
      - f1-telemetry-network
    volumes:
      - telemetry-logs:/app/logs
    healthcheck:
      test: ["CMD", "pgrep", "-f", "telemetry-ingest"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      zeromq-broker:
        condition: service_healthy

  # Service 2: Telemetry Processor (Python Middleware)
  telemetry-processor:
    build:
      context: ./services/telemetry-processor
      dockerfile: Dockerfile
      target: runtime
    container_name: f1-telemetry-processor
    restart: unless-stopped
    ports:
      - "8765:8765"  # WebSocket port
    environment:
      - ZMQ_SUBSCRIBER_ENDPOINT=tcp://telemetry-ingest:5555
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8765
      - MODE=passthrough  # or datacollection
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    networks:
      - f1-telemetry-network
    volumes:
      - telemetry-data:/app/data
      - telemetry-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8765)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      telemetry-ingest:
        condition: service_healthy

  # Service 3: Telemetry Frontend (React + TypeScript)
  telemetry-frontend:
    build:
      context: ./services/telemetry-frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: f1-telemetry-frontend
    restart: unless-stopped
    ports:
      - "3000:80"  # Production Nginx port
    environment:
      - VITE_WEBSOCKET_URL=ws://localhost:8765
      - NODE_ENV=production
    networks:
      - f1-telemetry-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      telemetry-processor:
        condition: service_healthy

networks:
  f1-telemetry-network:
    driver: bridge
    name: f1-telemetry-network

volumes:
  telemetry-data:
    name: f1-telemetry-data
  telemetry-logs:
    name: f1-telemetry-logs
