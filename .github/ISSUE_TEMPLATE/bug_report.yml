name: Bug Report
description: Report a bug or issue
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug!

  - type: dropdown
    id: service
    attributes:
      label: Which service is affected?
      options:
        - Telemetry Ingest (C++)
        - Telemetry Processor (Python)
        - Telemetry Frontend (React)
        - Docker/Deployment
        - Monitoring
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Tell us what happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Start services with '...'
        2. Configure F1 game with '...'
        3. Observe error at '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Please paste relevant logs
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: What version are you running?
      placeholder: e.g., 1.0.0, main branch

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      placeholder: e.g., Ubuntu 22.04, macOS 14, Windows 11

  - type: input
    id: docker
    attributes:
      label: Docker Version
      description: What Docker version are you using?
      placeholder: Run 'docker --version'

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
