name: Python Service CI

on:
  push:
    paths:
      - 'services/telemetry-processor/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'services/telemetry-processor/**'

jobs:
  lint-and-test:
    name: Lint and Test Python Service
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: services/telemetry-processor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov black flake8 mypy
      
      - name: Lint with flake8
        working-directory: services/telemetry-processor
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Format check with black
        working-directory: services/telemetry-processor
        run: |
          black --check .
      
      - name: Type check with mypy
        working-directory: services/telemetry-processor
        run: |
          mypy . --ignore-missing-imports || true
      
      - name: Test with pytest
        working-directory: services/telemetry-processor
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: services/telemetry-processor/coverage.xml
          flags: telemetry-processor
