// Event string code mappings
// SSTA -> SESSION_STARTED
// SEND -> SESSION_ENDED
// FTLP -> FASTEST_LAP
// RTMT -> RETIREMENT
// DRSE -> DRS_ENABLED
// DRSD -> DRS_DISABLED
// TMPT -> TEAM_MATE_IN_PITS
// CHQF -> CHEQUERED_FLAG
// RCWN -> RACE_WINNER
// PENA -> PENALTY_ISSUED
// SPTP -> SPEED_TRAP_TRIGGERED
// STLG -> START_LIGHT
// LGOT -> LIGHTS_OUT
// DTSV -> DRIVE_THROUGH_SERVED
// SGSV -> STOP_GO_SERVED
// FLBK -> FLASHBACK
// BUTN -> BUTTON_STATUS
// RDFL -> RED_FLAG
// OVTK -> OVERTAKE

