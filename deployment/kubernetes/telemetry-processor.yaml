apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-processor
  labels:
    app: telemetry-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-processor
  template:
    metadata:
      labels:
        app: telemetry-processor
    spec:
      containers:
        - name: telemetry-processor
          image: f1-telemetry-processor:dev
          ports:
            - containerPort: 8765
              protocol: TCP
          env:
            - name: ZMQ_SUBSCRIBER_ENDPOINT
              value: "tcp://telemetry-ingest:5555"
            - name: WEBSOCKET_HOST
              value: "0.0.0.0"
            - name: WEBSOCKET_PORT
              value: "8765"
            - name: MODE
              value: "passthrough"
            - name: LOG_LEVEL
              value: "info"
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-processor
spec:
  selector:
    app: telemetry-processor
  ports:
    - name: websocket
      protocol: TCP
      port: 8765
      targetPort: 8765
  type: ClusterIP
